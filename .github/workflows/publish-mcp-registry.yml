name: Publish to MCP Registry

# Publishes server.json to registry.modelcontextprotocol.io under io.github.CloudStudioIoT.
# Run it by hand after each npm release; GitHub OIDC proves the repository belongs to the
# organization, so no token is stored anywhere.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: curl -sSfL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
